name: Connect Google Drive (test builds)

# Run this once from the Actions tab. It shows a code on the run's page; approve it on your
# phone at google.com/device. The Drive access is then saved as the DRIVE_REFRESH_TOKEN secret,
# so test builds can copy their APK to your Google Drive.
#
# Needs a secret named LIVETV_SECRETS_TOKEN first: a fine-grained GitHub token for this repo
# only, with the permission "Secrets: Read and write" (used only to save the Drive access).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Connect Google Drive
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GH_TOKEN: ${{ secrets.LIVETV_SECRETS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the LIVETV_SECRETS_TOKEN secret first (see the top of this file)."
            exit 1
          fi
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then
            echo "::error::GOOGLE_DRIVE_CLIENT_ID / GOOGLE_DRIVE_CLIENT_SECRET secrets are missing."
            exit 1
          fi

          # Only the files this connection creates itself (it can't see anything else in your Drive).
          codes=$(curl -s https://oauth2.googleapis.com/device/code \
            -d "client_id=$CLIENT_ID" \
            --data-urlencode "scope=https://www.googleapis.com/auth/drive.file")
          device=$(jq -r '.device_code // empty' <<<"$codes")
          user=$(jq -r '.user_code // empty' <<<"$codes")
          url=$(jq -r '.verification_url // "https://www.google.com/device"' <<<"$codes")
          interval=$(jq -r '.interval // 5' <<<"$codes")
          expires=$(jq -r '.expires_in // 1800' <<<"$codes")
          if [ -z "$device" ] || [ -z "$user" ]; then
            echo "::error::Google refused: $(jq -r '.error // "unknown"' <<<"$codes") $(jq -r '.error_description // ""' <<<"$codes")"
            exit 1
          fi

          echo "::notice title=Approve on your phone::Go to $url and enter the code $user (good for $((expires / 60)) minutes)"
          echo "Go to $url and enter the code: $user"

          deadline=$(( $(date +%s) + expires ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            sleep "$interval"
            resp=$(curl -s https://oauth2.googleapis.com/token \
              -d "client_id=$CLIENT_ID" \
              -d "client_secret=$CLIENT_SECRET" \
              -d "device_code=$device" \
              -d "grant_type=urn:ietf:params:oauth:grant-type:device_code")
            err=$(jq -r '.error // empty' <<<"$resp")
            case "$err" in
              "")
                refresh=$(jq -r '.refresh_token // empty' <<<"$resp")
                if [ -z "$refresh" ]; then echo "::error::Google didn't return a lasting connection. Run it again."; exit 1; fi
                # Never shown in the log (this repo is public).
                echo "::add-mask::$refresh"
                gh secret set DRIVE_REFRESH_TOKEN --body "$refresh" -R "$GITHUB_REPOSITORY"
                echo "::notice title=Connected::Test builds will now be copied to your Google Drive."
                exit 0
                ;;
              authorization_pending) ;;
              slow_down) interval=$((interval + 5)) ;;
              access_denied) echo "::error::Sign-in was declined."; exit 1 ;;
              *) echo "::error::Google sign-in failed ($err)."; exit 1 ;;
            esac
          done
          echo "::error::The code expired. Run it again."
          exit 1
