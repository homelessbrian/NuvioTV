name: Setup Live TV Issue System

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  setup:
    name: Configure Live TV Issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create issue template directory
        run: |
          mkdir -p .github/ISSUE_TEMPLATE

      - name: Create issue configuration
        run: |
          cat > .github/ISSUE_TEMPLATE/config.yml <<'EOF'
          blank_issues_enabled: false

          contact_links:
            - name: 📖 Nuvio With Live TV
              url: https://github.com/${{ github.repository }}
              about: View the project, documentation, and current development status.
          EOF

      - name: Create Live TV Feature Request
        run: |
          cat > .github/ISSUE_TEMPLATE/live_tv_feature.yml <<'EOF'
          name: "📺 Live TV Feature Request"
          description: "Suggest a new Live TV feature or improvement"
          title: "[Live TV]: "
          labels:
            - feature-request
            - triage

          body:
            - type: markdown
              attributes:
                value: |
                  ## 📺 Nuvio With Live TV

                  This repository is focused specifically on Live TV functionality.

                  Please only submit requests related to Live TV, IPTV, EPG,
                  playlists, channels, or other Live TV functionality.

                  Requests unrelated to Live TV may be closed.

                  Before submitting, please search existing issues for similar requests.

            - type: input
              id: feature
              attributes:
                label: Feature request
                description: Give your idea a short, descriptive name.
                placeholder: "Add recently watched channels to the Live TV home section"
              validations:
                required: true

            - type: textarea
              id: description
              attributes:
                label: What would you like to see?
                description: Describe the feature or change you'd like.
                placeholder: |
                  Explain what you'd like Nuvio With Live TV to do.
              validations:
                required: true

            - type: textarea
              id: use_case
              attributes:
                label: Why would this be useful?
                description: Explain what problem this would solve or how it would improve Live TV.
                placeholder: |
                  Explain how this would improve your Live TV experience.
              validations:
                required: true

            - type: dropdown
              id: area
              attributes:
                label: Live TV area
                multiple: true
                options:
                  - Live TV Home
                  - Channel List
                  - TV Guide / EPG
                  - Favorites
                  - Recently Watched
                  - Groups / Categories
                  - M3U Playlists
                  - Xtream Codes
                  - XMLTV
                  - Catch-up
                  - Channel Logos
                  - Live TV Player
                  - Search
                  - Other
              validations:
                required: true

            - type: textarea
              id: example
              attributes:
                label: Examples or screenshots
                description: Screenshots, mockups, or examples from other IPTV apps are welcome.

            - type: textarea
              id: additional
              attributes:
                label: Additional information
                description: Anything else that might help explain the request.

            - type: checkboxes
              id: confirmation
              attributes:
                label: Confirmation
                options:
                  - label: This request is specifically related to Live TV functionality.
                    required: true
                  - label: I searched existing issues and did not find an existing request.
                    required: true
          EOF

      - name: Create Live TV Bug Report
        run: |
          cat > .github/ISSUE_TEMPLATE/live_tv_bug.yml <<'EOF'
          name: "🐛 Live TV Bug Report"
          description: "Report a problem with Live TV functionality"
          title: "[Bug][Live TV]: "
          labels:
            - bug
            - triage

          body:
            - type: markdown
              attributes:
                value: |
                  ## 🐛 Live TV Bug Report

                  This form is for bugs specifically related to Live TV functionality.

                  Please do not use this form for problems with the original
                  Nuvio movie, TV show, or unrelated functionality.

            - type: textarea
              id: problem
              attributes:
                label: What happened?
                description: Clearly describe the problem.
                placeholder: |
                  Tell us what went wrong.
              validations:
                required: true

            - type: textarea
              id: steps
              attributes:
                label: Steps to reproduce
                description: Tell us exactly how to reproduce the problem.
                placeholder: |
                  1. Open Nuvio With Live TV
                  2. Open Live TV
                  3. Select...
                  4. The problem occurs...
              validations:
                required: true

            - type: textarea
              id: expected
              attributes:
                label: What did you expect to happen?
              validations:
                required: true

            - type: dropdown
              id: area
              attributes:
                label: Live TV area
                options:
                  - Live TV Home
                  - Channel List
                  - TV Guide / EPG
                  - Favorites
                  - Recently Watched
                  - Groups / Categories
                  - M3U Playlists
                  - Xtream Codes
                  - XMLTV
                  - Catch-up
                  - Channel Logos
                  - Live TV Player
                  - Search
                  - Other
              validations:
                required: true

            - type: input
              id: version
              attributes:
                label: Nuvio With Live TV version
                placeholder: "Example: 2.9"

            - type: input
              id: device
              attributes:
                label: Device
                placeholder: "Example: NVIDIA Shield TV Pro"

            - type: textarea
              id: provider
              attributes:
                label: Playlist / provider information
                description: |
                  If relevant, tell us whether you are using M3U, Xtream Codes,
                  XMLTV, etc. Do not post usernames, passwords, server URLs,
                  or other private account information.
                placeholder: |
                  Example: Xtream Codes + XMLTV

            - type: textarea
              id: screenshots
              attributes:
                label: Screenshots or logs
                description: Drag screenshots or relevant logs here.

            - type: textarea
              id: additional
              attributes:
                label: Additional information
                description: Anything else that may help reproduce the issue.

            - type: checkboxes
              id: confirmation
              attributes:
                label: Confirmation
                options:
                  - label: This problem is specifically related to Live TV functionality.
                    required: true
                  - label: I searched existing issues and did not find a duplicate.
                    required: true
          EOF

      - name: Create Live TV UI/UX Request
        run: |
          cat > .github/ISSUE_TEMPLATE/live_tv_ui.yml <<'EOF'
          name: "🎨 Live TV UI / UX Suggestion"
          description: "Suggest an improvement to the Live TV interface or user experience"
          title: "[UI/UX][Live TV]: "
          labels:
            - ui-ux
            - triage

          body:
            - type: markdown
              attributes:
                value: |
                  ## 🎨 Live TV UI / UX

                  Use this form for suggestions specifically related to the
                  Live TV interface or user experience.

            - type: textarea
              id: current
              attributes:
                label: What could be improved?
                description: Describe the current experience.
              validations:
                required: true

            - type: textarea
              id: suggestion
              attributes:
                label: What would you change?
                description: Describe your proposed change.
              validations:
                required: true

            - type: dropdown
              id: area
              attributes:
                label: Live TV area
                options:
                  - Live TV Home
                  - Channel List
                  - TV Guide / EPG
                  - Favorites
                  - Recently Watched
                  - Groups / Categories
                  - Channel Search
                  - Live TV Player
                  - Other
              validations:
                required: true

            - type: textarea
              id: examples
              attributes:
                label: Screenshots or examples
                description: |
                  Screenshots, mockups, or examples from other IPTV applications
                  are highly encouraged.

            - type: textarea
              id: additional
              attributes:
                label: Additional information

            - type: checkboxes
              id: confirmation
              attributes:
                label: Confirmation
                options:
                  - label: This suggestion is specifically related to Live TV.
                    required: true
          EOF

      - name: Create Live TV labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          create_label() {
            NAME="$1"
            COLOR="$2"
            DESCRIPTION="$3"

            gh label create "$NAME" \
              --color "$COLOR" \
              --description "$DESCRIPTION" \
              --force \
              --repo "${{ github.repository }}"
          }

          # Type
          create_label "feature-request" "1D76DB" "New Live TV functionality"
          create_label "bug" "D73A4A" "Live TV bug or problem"
          create_label "ui-ux" "A371F7" "Live TV interface or UX suggestion"

          # Status
          create_label "triage" "FBCA04" "Needs review"
          create_label "planned" "0E8A16" "Planned for development"
          create_label "in-progress" "0052CC" "Currently being developed"
          create_label "completed" "5319E7" "Implemented and released"
          create_label "duplicate" "CFD3D7" "Duplicate of another issue"
          create_label "wont-fix" "FFFFFF" "Will not be implemented"

          # Live TV areas
          create_label "epg" "B60205" "TV guide and EPG"
          create_label "channels" "B60205" "Channel management"
          create_label "playlists" "B60205" "M3U and playlist functionality"
          create_label "xtream" "B60205" "Xtream Codes functionality"
          create_label "m3u" "B60205" "M3U functionality"
          create_label "xmltv" "B60205" "XMLTV functionality"
          create_label "catch-up" "B60205" "Catch-up TV functionality"
          create_label "player" "B60205" "Live TV playback"
          create_label "favorites" "B60205" "Live TV favorites"
          create_label "home-screen" "B60205" "Live TV home screen"

      - name: Create issue guidance
        run: |
          cat > .github/ISSUE_TEMPLATE/README.md <<'EOF'
          # Nuvio With Live TV Issue Guidelines

          Nuvio With Live TV is a fork of Nuvio focused on adding and improving
          Live TV functionality.

          ## What belongs here?

          Issues should be specifically related to:

          - Live TV
          - IPTV
          - M3U playlists
          - Xtream Codes
          - XMLTV / EPG
          - Channel management
          - Channel groups
          - Favorites
          - Recently watched channels
          - Catch-up TV
          - Live TV playback
          - Live TV search
          - Live TV UI / UX
          - Live TV integration with the Nuvio experience

          ## What does NOT belong here?

          Please do not submit requests or bugs for functionality unrelated
          to Live TV, including the original Nuvio movie and TV experience.

          ## Before submitting

          Please search existing issues first. Duplicate requests make it
          harder to track development.

          Feature requests are suggestions and are not guarantees of future
          implementation.
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github

          if git diff --cached --quiet; then
            echo "No file changes needed."
          else
            git commit -m "chore: add Live TV issue templates"
            git push
          fi

      - name: Finished
        run: |
          echo "Live TV issue system has been configured."
          echo ""
          echo "Created:"
          echo "- Feature Request"
          echo "- Bug Report"
          echo "- UI/UX Suggestion"
          echo "- Issue configuration"
          echo "- Live TV labels"
