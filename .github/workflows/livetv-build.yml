name: Build Nuvio + IPTV APK

# Push a tag like v1.0.0 (or run it by hand from the Actions tab) to build the APK.
# Tagged builds are attached to a GitHub Release automatically.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      test_build:
        description: "Test build: installs next to your real app as \"Nuvio + IPTV Test\""
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Write app keys
        env:
          NUVIO_BACKEND_URL: ${{ secrets.NUVIO_BACKEND_URL }}
          NUVIO_BACKEND_KEY: ${{ secrets.NUVIO_BACKEND_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
          SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
          SIMKL_APP_NAME: ${{ secrets.SIMKL_APP_NAME }}
          MDBLIST_CLIENT_ID: ${{ secrets.MDBLIST_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          PREMIUMIZE_CLIENT_ID: ${{ secrets.PREMIUMIZE_CLIENT_ID }}
          # IMDb ratings (episode ratings and the rating on details pages) come from Nuvio's
          # ratings services; without these the app has nowhere to ask, so no ratings show.
          IMDB_RATINGS_API_BASE_URL: ${{ secrets.IMDB_RATINGS_API_BASE_URL }}
          IMDB_TAPFRAME_API_BASE_URL: ${{ secrets.IMDB_TAPFRAME_API_BASE_URL }}
          # Skip intro: IntroDB (introdb.app), a free and open timestamp service (no key needed to
          # read). A secret can point it elsewhere; otherwise the public address is used.
          INTRODB_API_URL: ${{ secrets.INTRODB_API_URL }}
        run: |
          : > keys.properties
          add() { if [ -n "$2" ]; then echo "$1=$2" >> keys.properties; fi; }
          if [ -n "$NUVIO_BACKEND_URL" ]; then
            BACKEND="${NUVIO_BACKEND_URL%/}"
            add NUVIO_SUPABASE_URL "$BACKEND"
            add NUVIO_SUPABASE_ANON_KEY "$NUVIO_BACKEND_KEY"
            case "$BACKEND" in
              *api.nuvio.tv*)
                # Official Nuvio accounts: the app's built-in nuvio.tv login pages are already right.
                ;;
              *)
                # Self-hosted server: its login pages live on the server itself.
                add TV_LOGIN_WEB_BASE_URL "$BACKEND/tv-login"
                add DEVICE_LOGIN_WEB_BASE_URL "$BACKEND/link"
                add AVATAR_PUBLIC_BASE_URL "$BACKEND/storage/v1/object/public/avatars"
                ;;
            esac
          fi
          add TMDB_API_KEY "$TMDB_API_KEY"
          add TRAKT_CLIENT_ID "$TRAKT_CLIENT_ID"
          add TRAKT_CLIENT_SECRET "$TRAKT_CLIENT_SECRET"
          add SIMKL_CLIENT_ID "$SIMKL_CLIENT_ID"
          add SIMKL_APP_NAME "$SIMKL_APP_NAME"
          add MDBLIST_CLIENT_ID "$MDBLIST_CLIENT_ID"
          add GOOGLE_DRIVE_CLIENT_ID "$GOOGLE_DRIVE_CLIENT_ID"
          add GOOGLE_DRIVE_CLIENT_SECRET "$GOOGLE_DRIVE_CLIENT_SECRET"
          add PREMIUMIZE_CLIENT_ID "$PREMIUMIZE_CLIENT_ID"
          add IMDB_RATINGS_API_BASE_URL "$IMDB_RATINGS_API_BASE_URL"
          add IMDB_TAPFRAME_API_BASE_URL "$IMDB_TAPFRAME_API_BASE_URL"
          add INTRODB_API_URL "${INTRODB_API_URL:-https://api.introdb.app/}"
          # The build reads some values from each file, so write both.
          cp keys.properties local.properties
          cp keys.properties local.dev.properties
          rm keys.properties
          echo "Keys set:"; cut -d= -f1 local.properties

      # A fixed key committed to the repo so every build can update the previous install.
      # To use your own private key instead, add a secret named LIVETV_KEYSTORE_BASE64
      # (store password / key password "livetvfork", alias "livetv").
      - name: Signing
        env:
          LIVETV_KEYSTORE_BASE64: ${{ secrets.LIVETV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LIVETV_KEYSTORE_BASE64" ]; then
            printf '%s' "$LIVETV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/key.jks"
          else
            cp keystore/livetv-fork.jks "$RUNNER_TEMP/key.jks"
          fi
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/key.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=livetvfork"
            echo "NUVIO_RELEASE_STORE_PASSWORD=livetvfork"
          } >> "$GITHUB_ENV"

      - name: Name the test build
        if: ${{ inputs.test_build }}
        run: |
          # "Nuvio + IPTV" -> "Nuvio + IPTV Test" in every language, so the two apps are easy to
          # tell apart on the home screen.
          for f in app/src/full/res/values*/livetv_app_name.xml; do
            sed -i 's#>\([^<]*\)</string>#>\1 Test</string>#' "$f"
          done
          grep -h "app_name" app/src/full/res/values/livetv_app_name.xml

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullRelease --stacktrace -PlivetvTestBuild=${{ inputs.test_build == true }}

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk/full/release -name "*.apk" -exec cp {} out/ \;
          ls -la out

      # Test build: the single APK as it is (no zip to open), named so it's easy to spot.
      - name: Name the test APK
        if: ${{ inputs.test_build }}
        run: |
          apk=$(ls out/*.apk | head -n 1)
          mv "$apk" "out/Nuvio-IPTV-Test-$(date -u +%Y%m%d-%H%M).apk"
          ls -la out

      - name: Upload test APK
        if: ${{ inputs.test_build }}
        uses: actions/upload-artifact@v7
        with:
          path: out/Nuvio-IPTV-Test-*.apk
          # Downloads as the .apk itself instead of a zip.
          archive: false
          if-no-files-found: error
          # Deleted after a day (the Actions tab of a public repo can be seen by any signed-in
          # GitHub user).
          retention-days: 1

      # Test build: also copied to your Google Drive, in "Nuvio + IPTV test builds" (private,
      # only you can see it). Set up once with the "Connect Google Drive (test builds)"
      # workflow. Test builds in that folder older than a day are removed, like here.
      # If anything goes wrong here the build itself still counts as done.
      - name: Copy test APK to Google Drive
        if: ${{ inputs.test_build }}
        continue-on-error: true
        env:
          CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          REFRESH: ${{ secrets.DRIVE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$REFRESH" ]; then
            echo "Google Drive not connected (run \"Connect Google Drive (test builds)\" once); skipping."
            exit 0
          fi
          resp=$(curl -s https://oauth2.googleapis.com/token \
            -d "client_id=$CLIENT_ID" -d "client_secret=$CLIENT_SECRET" \
            -d "refresh_token=$REFRESH" -d "grant_type=refresh_token")
          token=$(jq -r '.access_token // empty' <<<"$resp")
          if [ -z "$token" ]; then
            echo "::warning::Couldn't sign in to Google Drive ($(jq -r '.error // "unknown"' <<<"$resp")). Run \"Connect Google Drive (test builds)\" again."
            exit 0
          fi
          echo "::add-mask::$token"
          auth="Authorization: Bearer $token"
          api=https://www.googleapis.com/drive/v3/files
          folder_name="Nuvio + IPTV test builds"

          # The folder (made the first time).
          folder=$(curl -s -G -H "$auth" "$api" \
            --data-urlencode "q=name='$folder_name' and mimeType='application/vnd.google-apps.folder' and trashed=false" \
            --data-urlencode "fields=files(id)" | jq -r '.files[0].id // empty')
          if [ -z "$folder" ]; then
            folder=$(curl -s -X POST -H "$auth" -H "Content-Type: application/json" "$api" \
              -d "{\"name\":\"$folder_name\",\"mimeType\":\"application/vnd.google-apps.folder\"}" | jq -r '.id // empty')
          fi
          if [ -z "$folder" ]; then echo "::warning::Couldn't make the Drive folder."; exit 0; fi

          # Upload (resumable, for a file this size).
          apk=$(ls out/Nuvio-IPTV-Test-*.apk | head -n 1)
          name=$(basename "$apk")
          location=$(curl -s -D - -o /dev/null -X POST -H "$auth" \
            -H "Content-Type: application/json; charset=UTF-8" \
            -H "X-Upload-Content-Type: application/vnd.android.package-archive" \
            -d "{\"name\":\"$name\",\"parents\":[\"$folder\"]}" \
            "https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable" \
            | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}')
          if [ -z "$location" ]; then echo "::warning::Google Drive didn't accept the upload."; exit 0; fi
          id=$(curl -s -X PUT -H "$auth" -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$apk" "$location" | jq -r '.id // empty')
          if [ -z "$id" ]; then echo "::warning::The upload to Google Drive didn't finish."; exit 0; fi
          echo "::notice title=Copied to Google Drive::$name is in \"$folder_name\" in your Drive."

          # Older test builds in that folder (more than a day old) are removed.
          cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%S)
          curl -s -G -H "$auth" "$api" \
            --data-urlencode "q='$folder' in parents and trashed=false and createdTime < '$cutoff'" \
            --data-urlencode "fields=files(id,name)" | jq -r '.files[]?.id' | while read -r old; do
              [ -n "$old" ] && curl -s -X DELETE -H "$auth" "$api/$old" > /dev/null || true
            done

      - name: Upload build artifact
        if: ${{ !inputs.test_build }}
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-livetv-apks
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
