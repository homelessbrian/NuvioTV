name: Build Live TV APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare properties
        run: |
          touch local.properties
          touch local.dev.properties

      - name: Signing
        run: |
          cp keystore/livetv-fork.jks "$RUNNER_TEMP/key.jks"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/key.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=livetvfork"
            echo "NUVIO_RELEASE_STORE_PASSWORD=livetvfork"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleFullDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk/full/debug -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-livetv-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
